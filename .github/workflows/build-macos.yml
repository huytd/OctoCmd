name: Build OctoCmd macOS App

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build and archive macOS app
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "15.4"

      - name: Build and export OctoCmd.app
        run: |
          ./build_and_export.sh

      - name: List export contents
        run: |
          ls -R export

      - name: Upload exported artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tentacle-macos-build
          path: |
            export/**/*.zip
            export/**/*.app
            archive/*.xcarchive
          if-no-files-found: error
